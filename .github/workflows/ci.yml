name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [arxiv-scholar, youtube-transcript, web-to-markdown, market-pulse, memory-vault]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test ${{ matrix.server }}
        working-directory: servers/${{ matrix.server }}
        run: |
          pip install -e ".[dev]"
          pytest
