[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-transcript"
version = "0.1.0"
description = "A tiny MCP server that fetches YouTube transcripts (captions) as timestamped text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonas Hsu" }]
keywords = ["mcp", "model-context-protocol", "youtube", "transcript", "captions"]
dependencies = [
    "mcp>=1.2,<2",
    "youtube-transcript-api>=1.0",
]

[project.scripts]
youtube-transcript = "youtube_transcript.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_transcript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
