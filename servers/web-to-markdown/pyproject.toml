[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-to-markdown"
version = "0.3.0"
description = "A tiny MCP server that fetches web pages and returns their main content as clean Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonas Hsu" }]
keywords = ["mcp", "model-context-protocol", "web", "markdown", "scraping", "reader"]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "trafilatura>=1.8",
]

[project.scripts]
web-to-markdown = "web_to_markdown.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/web_to_markdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
