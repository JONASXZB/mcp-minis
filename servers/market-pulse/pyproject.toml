[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-pulse"
version = "0.3.0"
description = "A tiny MCP server for stock/index/crypto quotes and currency conversion — free data, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonas Hsu" }]
keywords = ["mcp", "model-context-protocol", "stocks", "finance", "fx", "crypto"]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.scripts]
market-pulse = "market_pulse.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/market_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
