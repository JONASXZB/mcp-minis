[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-scholar"
version = "0.3.0"
description = "A tiny MCP server for searching arXiv papers, reading metadata, and exporting BibTeX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonas Hsu" }]
keywords = ["mcp", "model-context-protocol", "arxiv", "papers", "research"]
dependencies = [
    "mcp>=1.2,<2",
    "arxiv>=2.1",
]

[project.scripts]
arxiv-scholar = "arxiv_scholar.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_scholar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
