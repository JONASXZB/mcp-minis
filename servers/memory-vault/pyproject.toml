[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-vault"
version = "0.4.0"
description = "A tiny MCP server giving agents a persistent, full-text-searchable local notebook (SQLite + FTS5)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonas Hsu" }]
keywords = ["mcp", "model-context-protocol", "memory", "notes", "sqlite", "fts5"]
dependencies = [
    "mcp>=1.2,<2",
]

[project.scripts]
memory-vault = "memory_vault.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
